name = "league-lab-api"
main = "index.js"
compatibility_date = "2026-11-13"

[vars]
ALLOWED_ORIGINS = "https://spsoohojeon-hash.github.io"

# Before deployment:
#   cd worker
#   npx wrangler secret put RIOT_API_KEY
#   npx wrangler deploy
#
# Riot API key must NEVER be stored in this file.
# For public rollout, configure Cloudflare WAF / Rate Limiting and obtain a Riot production key.
# Optional aggregated champion statistics require a real KV binding named CHAMPION_STATS_KV
# and a lawful, validated data ingestion pipeline. No stats are generated by this Worker.
